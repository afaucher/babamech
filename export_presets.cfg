; Godot export presets (committed). build.ps1 exports "Windows Desktop".
; version.txt is the build stamp build.ps1 writes just before exporting (BuildVersion).
; build/*, test_logs/*, docs/*, art/*, tools/* are never packed, nor tests/* and the test harness in scripts/test_support/
; (TestCase, NetTest, LayoutCheck, ShotCheck: nothing outside tests uses them). perf_probe.gd stays: game code reads
; PerfProbe.on. A release build's Boot --run-test finds no test and quits 2 (tests run from the editor binary only).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="version.txt"
exclude_filter="build/*,test_logs/*,docs/*,art/*,tools/*,tests/*,scripts/test_support/test_case.gd*,scripts/test_support/net_test.gd*,scripts/test_support/layout_check.gd*,scripts/test_support/shot_check.gd*"
export_path="build/windows/babamech.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
application/product_name="babamech"
